          alias = "aws.elasticache.authorizationFailures"
          conversion = "sum,rate"
          tags = [
            {
              key = "id"
              value = "key"
            }
          ]
        },
        {
          name = "IamAuthenticationExpirations"
          alias = "aws.elasticache.iamAuthentication"
          conversion = "sum,rate"
          tags = [
            {
              key = "id"
              value = "expirations"
            }
          ]
        },
        {
          name = "IamAuthenticationThrottling"
          alias = "aws.elasticache.iamAuthentication"
          conversion = "sum,rate"
          tags = [
            {
              key = "id"
              value = "throttling"
            }
          ]
        },

        {
          name = "HyperLogLogBasedCmds"
          alias = "aws.elasticache.commands"
          conversion = "sum,rate"
          tags = [
