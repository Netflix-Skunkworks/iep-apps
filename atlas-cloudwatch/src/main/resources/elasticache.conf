          alias = "aws.elasticache.commands"
          conversion = "sum,rate"
          tags = [
            {
              key = "id"
              value = "configSet"
            }
          ]
        },
        {
          name = "CmdTouch"
          alias = "aws.elasticache.commands"
          conversion = "sum,rate"
          tags = [
            {
              key = "id"
              value = "touch"
            }
          ]
