
atlas {
  cloudwatch {

    // -- elasticache for memcached --
    // https://docs.aws.amazon.com/AmazonElastiCache/latest/mem-ug/CacheMetrics.Memcached.html
    // https://docs.aws.amazon.com/AmazonElastiCache/latest/mem-ug/CacheMetrics.HostLevel.html
    // -- elasticache for redis --
    // https://docs.aws.amazon.com/AmazonElastiCache/latest/red-ug/CacheMetrics.Redis.html
    // https://docs.aws.amazon.com/AmazonElastiCache/latest/red-ug/CacheMetrics.HostLevel.html
    elasticache = {
      namespace = "AWS/ElastiCache"
      period = 1m
      end-period-offset = 5

      dimensions = [
        "CacheClusterId",
        "CacheNodeId"
      ]

      metrics = [
        // memcached and redis host-level metrics
        {
          name = "CPUUtilization"
          alias = "aws.elasticache.cpuUtilization"
          conversion = "max"
        },
        {
          name = "EngineCPUUtilization"
          alias = "aws.elasticache.engineCpuUtilization"
          conversion = "max"
        },
        {
          name = "FreeableMemory"
          alias = "aws.elasticache.memoryFree"
          conversion = "max"
        },
        {
          name = "NetworkBytesIn"
          alias = "aws.elasticache.networkThroughput"
          conversion = "sum,rate"
          tags = [
            {
              key = "id"
              value = "in"
            }
          ]
        },
        {
          name = "NetworkBytesOut"
          alias = "aws.elasticache.networkThroughput"
          conversion = "sum,rate"
          tags = [
            {
              key = "id"
              value = "out"
            }
          ]
        },
        {
          name = "SwapUsage"
          alias = "aws.elasticache.swapUsage"
          conversion = "max"
        },

        // memcached and redis cache metrics
        {
          name = "Evictions"
          alias = "aws.elasticache.itemsRemoved"
          conversion = "sum,rate"
          tags = [
            {
              key = "id"
              value = "evicted"
            }
          ]
        },
        {
          name = "Reclaimed"
          alias = "aws.elasticache.itemsRemoved"
          conversion = "sum,rate"
          tags = [
            {
              key = "id"
              value = "reclaimed"
            }
          ]
        },
        {
          name = "CurrConnections"
          alias = "aws.elasticache.numConnections"
          conversion = "max"
        },
        {
          name = "CurrItems"
          alias = "aws.elasticache.numItems"
          conversion = "max"
        },
        {
          name = "NewConnections"
          alias = "aws.elasticache.connections"
          conversion = "sum,rate"
        },


        // memcached cache metrics
        {
          name = "NewItems"
          alias = "aws.elasticache.items"
          conversion = "sum,rate"
        },
        {
          name = "BytesUsedForCacheItems"
          alias = "aws.elasticache.memoryUsed"
          conversion = "max"
          tags = [
            {
              key = "id"
              value = "cacheItems"
            }
          ]
        },
        {
          name = "BytesUsedForHash"
          alias = "aws.elasticache.memoryUsed"
          conversion = "max"
          tags = [
            {
              key = "id"
              value = "hashTables"
            }
          ]
        },
        {
          name = "SlabsMoved"
          alias = "aws.elasticache.slabsMoved"
          conversion = "sum"
        },
        {
          name = "DecrHits"
          alias = "aws.elasticache.requests"
          conversion = "sum,rate"
          tags = [
            {
              key = "id"
              value = "decr"
            },
            {
              key = "status"
              value = "hit"
            }
          ]
        },
        {
          name = "DecrMisses"
          alias = "aws.elasticache.requests"
          conversion = "sum,rate"
          tags = [
            {
              key = "id"
              value = "decr"
            },
            {
              key = "status"
              value = "miss"
            }
          ]
        },
        {
          name = "IncrHits"
          alias = "aws.elasticache.requests"
          conversion = "sum,rate"
          tags = [
            {
              key = "id"
              value = "incr"
            },
            {
              key = "status"
              value = "hit"
            }
          ]
        },
        {
          name = "IncrMisses"
          alias = "aws.elasticache.requests"
          conversion = "sum,rate"
          tags = [
            {
              key = "id"
              value = "incr"
            },
            {
              key = "status"
              value = "miss"
            }
          ]
        },
        {
          name = "DeleteHits"
          alias = "aws.elasticache.requests"
          conversion = "sum,rate"
          tags = [
            {
              key = "id"
              value = "delete"
            },
            {
              key = "status"
              value = "hit"
            }
          ]
        },
        {
          name = "DeleteMisses"
          alias = "aws.elasticache.requests"
          conversion = "sum,rate"
          tags = [
            {
              key = "id"
              value = "delete"
            },
            {
              key = "status"
              value = "miss"
            }
          ]
        },
        {
          name = "GetHits"
          alias = "aws.elasticache.requests"
          conversion = "sum,rate"
          tags = [
            {
              key = "id"
              value = "get"
            },
            {
              key = "status"
              value = "hit"
            }
          ]
        },
        {
          name = "GetMisses"
          alias = "aws.elasticache.requests"
          conversion = "sum,rate"
          tags = [
            {
              key = "id"
              value = "get"
            },
            {
              key = "status"
              value = "miss"
            }
          ]
        },
        {
          name = "TouchHits"
          alias = "aws.elasticache.requests"
          conversion = "sum,rate"
          tags = [
            {
              key = "id"
              value = "touch"
            },
            {
              key = "status"
              value = "hit"
            }
          ]
        },
        {
          name = "TouchMisses"
          alias = "aws.elasticache.requests"
          conversion = "sum,rate"
          tags = [
            {
              key = "id"
              value = "touch"
            },
            {
              key = "status"
              value = "miss"
            }
          ]
        },
        {
          name = "CasHits"
          alias = "aws.elasticache.requests"
          conversion = "sum,rate"
          tags = [
            {
              key = "id"
              value = "cas"
            },
            {
              key = "status"
              value = "hit"
            }
          ]
        },
        {
          name = "CasMisses"
          alias = "aws.elasticache.requests"
          conversion = "sum,rate"
          tags = [
            {
              key = "id"
              value = "cas"
            },
            {
              key = "status"
              value = "miss"
            }
          ]
        },
        {
          name = "CasBadval"
          alias = "aws.elasticache.requests"
          conversion = "sum,rate"
          tags = [
            {
              key = "id"
              value = "cas"
            },
            {
              key = "status"
              value = "badval"
            }
          ]
        },
        {
          name = "CmdGet"
          alias = "aws.elasticache.commands"
          conversion = "sum,rate"
          tags = [
            {
              key = "id"
              value = "get"
            }
          ]
        },
        {
