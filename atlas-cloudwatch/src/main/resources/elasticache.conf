        // redis cache metrics
        {
          name = "CacheHits"
          alias = "aws.elasticache.requests"
          conversion = "sum,rate"
          tags = [
            {
              key = "status"
              value = "hit"
            }
          ]
        },
        {
          name = "CacheMisses"
          alias = "aws.elasticache.requests"
          conversion = "sum,rate"
          tags = [
            {
              key = "status"
              value = "miss"
            }
          ]
        },
        {
          name = "DatabaseMemoryUsagePercentage"
          alias = "aws.elasticache.dbMemoryUsagePercent"
          conversion = "max"
          tags = []
        },
        {
          name = "ReplicationBytes"
          alias = "aws.elasticache.replicationThroughput"
          conversion = "sum,rate"
        },
        {
          name = "ReplicationLag"
          alias = "aws.elasticache.replicationLag"
          conversion = "max"
        },
        {
          name = "SaveInProgress"
          alias = "aws.elasticache.saveInProgress"
          conversion = "max"
        },
        {
          name = "IsMaster"
          alias = "aws.elasticache.isMaster"
          conversion = "max"
        },
        {
          name = "BytesUsedForCache"
          alias = "aws.elasticache.memoryUsed"
          conversion = "max"
        },

        // redis/valkey reliability and capacity metrics
        {
          name = "DatabaseCapacityUsagePercentage"
          alias = "aws.elasticache.dbCapacityUsagePercent"
          conversion = "max"
        },
        {
          name = "DatabaseCapacityUsageCountedForEvictPercentage"
          alias = "aws.elasticache.dbCapacityUsageCountedForEvictPercent"
          conversion = "max"
        },
        {
          name = "DatabaseMemoryUsageCountedForEvictPercentage"
          alias = "aws.elasticache.dbMemoryUsageCountedForEvictPercent"
          conversion = "max"
        },
        {
          name = "CacheHitRate"
          alias = "aws.elasticache.cacheHitRate"
          conversion = "max"
        },
        {
          name = "MemoryFragmentationRatio"
          alias = "aws.elasticache.memoryFragmentationRatio"
          conversion = "max"
        },
        {
          name = "AllocatorFragmentationBytes"
          alias = "aws.elasticache.allocatorFragmentationBytes"
          conversion = "max"
        },
        {
          name = "AllocatorFragmentationRatio"
          alias = "aws.elasticache.allocatorFragmentationRatio"
          conversion = "max"
        },
        {
          name = "UsedMemoryDataset"
          alias = "aws.elasticache.memoryUsed"
          conversion = "max"
          tags = [
            {
              key = "id"
              value = "dataset"
            }
          ]
        },
        {
          name = "MasterLinkHealthStatus"
          alias = "aws.elasticache.masterLinkHealthStatus"
          conversion = "max"
        },
        {
          name = "TrafficManagementActive"
          alias = "aws.elasticache.trafficManagementActive"
          conversion = "max"
        },
        {
          name = "GlobalDatastoreReplicationLag"
          alias = "aws.elasticache.globalDatastoreReplicationLag"
          conversion = "max"
        },
        {
          name = "DurabilityLag"
          alias = "aws.elasticache.durabilityLag"
          conversion = "max"
        },
        {
          name = "DurabilityBufferExceededErrorCount"
          alias = "aws.elasticache.durabilityBufferExceededErrors"
          conversion = "sum,rate"
        },
        {
          name = "ErrorCount"
          alias = "aws.elasticache.errors"
          conversion = "sum,rate"
        },

        // redis/valkey security and auth metrics
        {
          name = "AuthenticationFailures"
          alias = "aws.elasticache.authFailures"
          conversion = "sum,rate"
        },
        {
          name = "DatabaseAuthorizationFailures"
          alias = "aws.elasticache.authorizationFailures"
          conversion = "sum,rate"
          tags = [
            {
              key = "id"
              value = "database"
            }
