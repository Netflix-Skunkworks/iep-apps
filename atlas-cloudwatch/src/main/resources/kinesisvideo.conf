
atlas {
  cloudwatch {

    // https://docs.aws.amazon.com/kinesisvideostreams-webrtc-dg/latest/devguide/kvswebrtc-monitoring-cw.html
    //
    // Note that Failure and Latency are emitted for both the signaling operations and the
    // WebRTC ingestion operations (JoinStorageSession, JoinStorageSessionAsViewer) with the
    // same dimensions. They are distinguished by the Operation dimension (aws.op) so a single
    // definition is used for both.

    // Channel level metrics
    kvs-webrtc-channel = {
      namespace = "AWS/KinesisVideo"
      period = 1m
      end-period-offset = 5

      dimensions = [
        "SignalingChannelName"
      ]

      metrics = [
        {
          name = "MessagesTransferred.Count"
          alias = "aws.kvswebrtc.messagesTransferred"
          conversion = "sum,rate"
        },
        {
          name = "TurnConnectedMinutes"
          alias = "aws.kvswebrtc.turnConnectedMinutes"
          conversion = "sum,rate"
        }
      ]
    }

    // Signaling and ingestion API call metrics
    kvs-webrtc-op = {
      namespace = "AWS/KinesisVideo"
      period = 1m
      end-period-offset = 5

      dimensions = [
        "Operation",
        "SignalingChannelName"
      ]

      metrics = [
        {
          name = "Failure"
          alias = "aws.kvswebrtc.failure"
          conversion = "sum,rate"
        },
        {
          name = "Latency"
          alias = "aws.kvswebrtc.latency"
          conversion = "timer"
        }
      ]
    }

    // WebRTC ingestion metrics by participant role
    kvs-webrtc-role = {
      namespace = "AWS/KinesisVideo"
      period = 1m
      end-period-offset = 5

      dimensions = [
        "Operation",
        "SignalingChannelName",
        "Role"
      ]

      metrics = [
        {
          name = "TotalBitrate"
          alias = "aws.kvswebrtc.totalBitrate"
          conversion = "max"
        },
        {
          name = "TotalPacketCount"
          alias = "aws.kvswebrtc.totalPackets"
          conversion = "sum,rate"
        },
        {
          name = "WebRTCRecordingMinutes"
          alias = "aws.kvswebrtc.recordingMinutes"
          conversion = "sum,rate"
        },
        {
          name = "WebRTCViewerMinutes"
          alias = "aws.kvswebrtc.viewerMinutes"
          conversion = "sum,rate"
        }
      ]
    }

  }
}
